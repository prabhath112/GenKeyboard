name: Bug report
description: Something in GenKeyboard does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: GenKeyboard version
      description: Settings → About, or the release tag
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: Android 15, Pixel 8
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, logcat excerpt. Remove personal text and never paste API keys.
