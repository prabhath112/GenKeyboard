name: Feature request
description: Suggest an AI action or keyboard improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI writing tools
        - Keyboard / typing
        - Settings / UI
        - Backend / API
        - Other
