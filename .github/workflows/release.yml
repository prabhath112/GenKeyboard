name: Release

# Push a tag like v0.1.0 to build the signed AAB + APK and publish a GitHub Release.
# Needs repository secrets (see README "Release signing"):
#   KEYSTORE_BASE64   base64 of genkeyboard-release.jks
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > genkeyboard-release.jks
          cat > keystore.properties <<EOF
          storeFile=../genkeyboard-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build signed release
        run: ./gradlew :app:bundleRelease :app:assembleRelease --console=plain

      - name: Verify signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/GenKeyboard-${GITHUB_REF_NAME}.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/GenKeyboard-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Release notes from CHANGELOG.md
        # Uses the "## <version>" section matching the tag (v1.0.0 -> "## 1.0.0"); falls back to auto-notes.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            /^## /{ if (found) exit; found = ($2 == ver); next }
            found { print }
          ' CHANGELOG.md > notes.md || true
          if [ -s notes.md ]; then echo "NOTES=--notes-file notes.md" >> "$GITHUB_ENV"; else echo "NOTES=--generate-notes" >> "$GITHUB_ENV"; fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "GenKeyboard ${GITHUB_REF_NAME#v}" \
            $NOTES \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)

      - name: Shred keystore
        if: always()
        run: rm -f genkeyboard-release.jks keystore.properties
